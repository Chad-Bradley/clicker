<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎴 抽卡合成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0d1a;
            --panel: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --text: #e8e8f0;
            --text-dim: rgba(255,255,255,0.4);
            --accent: #f7c948;
            --n-color: #8fafc0;
            --r-color: #5bc77e;
            --sr-color: #a078e0;
            --ssr-color: #f0a030;
            --shard-color: #7dd3fc;
            --auto-color: #ff6b9d;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        .app { width: 100%; max-width: 440px; display: flex; flex-direction: column; min-height: 100dvh; }

        /* Top Bar */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .top-bar .title { font-size: 18px; font-weight: 700; }
        .top-bar .stats { display: flex; gap: 8px; font-size: 12px; flex-wrap: wrap; justify-content: flex-end; }
        .top-bar .stat-item {
            display: flex; align-items: center; gap: 3px;
            background: var(--panel); padding: 3px 8px; border-radius: 16px;
        }

        /* Tabs */
        .tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; overflow-x: auto; }
        .tab {
            flex: 1; min-width: 60px; padding: 10px 0; text-align: center;
            font-size: 12px; cursor: pointer; color: var(--text-dim);
            transition: color 0.15s, border-color 0.15s;
            border-bottom: 2px solid transparent; user-select: none; white-space: nowrap;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

        /* Content */
        .content { flex: 1; overflow-y: auto; padding: 16px; }
        .content::-webkit-scrollbar { width: 4px; }
        .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        .page { display: none; }
        .page.active { display: block; }

        /* Draw Page */
        .draw-area { display: flex; flex-direction: column; align-items: center; padding: 16px 0 12px; }
        .draw-btn {
            width: 160px; height: 160px; border-radius: 50%;
            border: 4px solid rgba(247,201,72,0.25);
            background: radial-gradient(circle at 35% 30%, #2a2540, #141824);
            cursor: pointer; font-size: 64px;
            transition: transform 0.08s, box-shadow 0.2s;
            box-shadow: 0 0 40px rgba(247,201,72,0.08), inset 0 0 40px rgba(247,201,72,0.03);
            user-select: none; color: #fff; position: relative;
        }
        .draw-btn:not(:disabled):hover { box-shadow: 0 0 60px rgba(247,201,72,0.15), inset 0 0 40px rgba(247,201,72,0.05); }
        .draw-btn:not(:disabled):active { transform: scale(0.93); }
        .draw-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .draw-btn .cooldown-overlay {
            position: absolute; inset: 0; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6); font-size: 20px; font-weight: 700;
            opacity: 0; transition: opacity 0.2s;
        }
        .draw-btn:disabled .cooldown-overlay { opacity: 1; }

        .draw-info { margin-top: 10px; font-size: 13px; color: var(--text-dim); text-align: center; }

        .draw-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; justify-content: center; }
        .draw-action-btn {
            padding: 7px 18px; border-radius: 18px; border: 1px solid var(--border);
            background: var(--panel); color: var(--text); font-size: 13px; cursor: pointer;
            transition: background 0.2s;
        }
        .draw-action-btn:hover { background: rgba(255,255,255,0.08); }
        .draw-action-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .draw-action-btn.active-auto {
            background: rgba(255,107,157,0.2); border-color: var(--auto-color); color: var(--auto-color);
        }

        /* Draw Result */
        .draw-result {
            margin-top: 12px; min-height: 70px;
            display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center;
            padding: 10px; background: var(--panel); border-radius: 14px; border: 1px solid var(--border);
        }
        .draw-result.empty { color: var(--text-dim); font-size: 13px; }
        .draw-card {
            width: 48px; height: 58px; border-radius: 9px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 24px; border: 2px solid var(--border);
            background: var(--panel); animation: cardIn 0.3s ease-out backwards; position: relative;
        }
        .draw-card .rarity-tag { font-size: 8px; margin-top: 1px; font-weight: 600; }
        .draw-card[data-rarity="N"]  { border-color: var(--n-color); }
        .draw-card[data-rarity="N"] .rarity-tag { color: var(--n-color); }
        .draw-card[data-rarity="R"]  { border-color: var(--r-color); }
        .draw-card[data-rarity="R"] .rarity-tag { color: var(--r-color); }
        .draw-card[data-rarity="SR"] { border-color: var(--sr-color); }
        .draw-card[data-rarity="SR"] .rarity-tag { color: var(--sr-color); }
        .draw-card[data-rarity="SSR"] {
            border-color: var(--ssr-color); box-shadow: 0 0 14px rgba(240,160,48,0.2);
        }
        .draw-card[data-rarity="SSR"] .rarity-tag { color: var(--ssr-color); }
        .draw-card[data-decomposed] { border-color: var(--shard-color); opacity: 0.7; }
        .draw-card[data-guaranteed]::after {
            content: '🛡️'; position: absolute; top: -6px; right: -6px; font-size: 12px;
        }

        @keyframes cardIn {
            0% { opacity: 0; transform: scale(0.5) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Album Page */
        .album-group { margin-bottom: 16px; }
        .album-group-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; padding: 0 4px; }
        .album-group-title .tag {
            display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 10px; margin-left: 6px;
        }
        .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; }
        .album-card {
            background: var(--panel); border-radius: 9px; border: 1px solid var(--border);
            padding: 6px 2px 4px; text-align: center; cursor: pointer;
            transition: background 0.15s; position: relative;
        }
        .album-card:hover { background: rgba(255,255,255,0.07); }
        .album-card .card-emoji { font-size: 24px; line-height: 1.2; }
        .album-card .card-name { font-size: 10px; color: var(--text-dim); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .album-card .card-count { font-size: 11px; font-weight: 600; margin-top: 1px; }
        .album-card[data-rarity="N"]  .card-count { color: var(--n-color); }
        .album-card[data-rarity="R"]  .card-count { color: var(--r-color); }
        .album-card[data-rarity="SR"] .card-count { color: var(--sr-color); }
        .album-card[data-rarity="SSR"] .card-count { color: var(--ssr-color); }
        .album-card .decompose-btn {
            position: absolute; top: -4px; right: -4px; width: 18px; height: 18px;
            border-radius: 50%; border: none; background: rgba(255,80,80,0.85);
            color: #fff; font-size: 10px; cursor: pointer; display: none;
            align-items: center; justify-content: center; line-height: 1;
        }
        .album-card:hover .decompose-btn { display: flex; }
        .album-card .decompose-btn:hover { background: #e04040; }

        /* Craft Page */
        .shard-bar {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 14px; background: var(--panel); border-radius: 12px;
            border: 1px solid var(--border); margin-bottom: 14px; flex-wrap: wrap;
        }
        .shard-bar .shard-icon { font-size: 18px; }
        .shard-bar .shard-count { font-weight: 700; font-size: 15px; color: var(--shard-color); }
        .shard-bar .shard-label { font-size: 12px; color: var(--text-dim); }
        .shard-bar .shard-btn {
            margin-left: auto; padding: 4px 10px; border-radius: 8px;
            border: 1px solid var(--border); background: transparent; color: var(--text);
            font-size: 11px; cursor: pointer;
        }
        .shard-bar .shard-btn:hover { background: rgba(255,255,255,0.06); }

        .tool-list { display: flex; flex-direction: column; gap: 10px; }
        .tool-item {
            background: var(--panel); border-radius: 12px; border: 1px solid var(--border);
            padding: 12px 14px;
        }
        .tool-header { display: flex; align-items: center; gap: 10px; }
        .tool-icon { font-size: 24px; }
        .tool-meta { flex: 1; min-width: 0; }
        .tool-name { font-size: 14px; font-weight: 600; }
        .tool-level { font-size: 11px; color: var(--text-dim); }
        .tool-effect { font-size: 11px; color: var(--accent); margin-top: 1px; }
        .tool-body { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
        .tool-cost { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; line-height: 1.6; }
        .tool-cost .cost-item { display: inline-block; margin: 1px 4px 1px 0; }
        .tool-cost .cost-item .enough { color: #5bc77e; }
        .tool-cost .cost-item .lack   { color: #e05858; }
        .tool-craft-btn {
            padding: 5px 18px; border-radius: 8px; border: none; font-size: 12px;
            font-weight: 600; cursor: pointer; transition: transform 0.15s, opacity 0.2s;
            background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
        }
        .tool-craft-btn:hover:not(:disabled) { transform: scale(1.04); }
        .tool-craft-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .tool-craft-btn.maxed { background: #2ecc71; cursor: default; opacity: 0.7; }

        /* Achievements */
        .achieve-list { display: flex; flex-direction: column; gap: 8px; }
        .achieve-item {
            display: flex; align-items: center; gap: 10px;
            background: var(--panel); border-radius: 10px; border: 1px solid var(--border);
            padding: 10px 12px;
        }
        .achieve-icon { font-size: 22px; }
        .achieve-info { flex: 1; min-width: 0; }
        .achieve-name { font-size: 13px; font-weight: 600; }
        .achieve-desc { font-size: 11px; color: var(--text-dim); }
        .achieve-state {
            font-size: 10px; padding: 3px 10px; border-radius: 16px; flex-shrink: 0;
        }
        .achieve-state.done { background: rgba(46,204,113,0.2); color: #2ecc71; }
        .achieve-state.claimable { background: rgba(247,201,72,0.2); color: var(--accent); cursor: pointer; }
        .achieve-state.claimable:hover { background: rgba(247,201,72,0.3); }
        .achieve-state.locked { background: rgba(255,255,255,0.05); color: var(--text-dim); }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px); display: none; justify-content: center;
            align-items: center; z-index: 999;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #1a1d2e; border: 1px solid var(--border); border-radius: 18px;
            padding: 20px; max-width: 340px; width: 90%; text-align: center;
            animation: modalIn 0.25s ease-out; max-height: 80vh; overflow-y: auto;
        }
        @keyframes modalIn {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .modal-sub  { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
        .modal-cards { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 14px; }
        .modal-close {
            padding: 7px 24px; border-radius: 18px; border: 1px solid var(--border);
            background: var(--panel); color: var(--text); font-size: 13px; cursor: pointer;
        }
        .modal-close:hover { background: rgba(255,255,255,0.08); }

        .footer { text-align: center; padding: 8px; font-size: 11px; color: var(--text-dim); border-top: 1px solid var(--border); flex-shrink: 0; }

        .toast {
            position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            padding: 8px 20px; border-radius: 18px; font-size: 13px;
            z-index: 1000; pointer-events: none; opacity: 0;
            transition: opacity 0.3s; border: 1px solid var(--border); white-space: nowrap;
        }
        .toast.show { opacity: 1; }

        @media (max-width: 440px) {
            .draw-btn { width: 140px; height: 140px; font-size: 54px; }
            .top-bar .stats { gap: 4px; }
            .top-bar .stat-item { font-size: 10px; padding: 2px 6px; }
            .album-grid { grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); }
            .tab { font-size: 11px; min-width: 50px; }
        }
    </style>
</head>
<body>

<div class="app">
    <div class="top-bar">
        <div class="title">🎴 抽卡合成器</div>
        <div class="stats">
            <div class="stat-item">💎 <span id="shardTop">0</span></div>
            <div class="stat-item">📦 <span id="cardTotalTop">0</span></div>
            <div class="stat-item">🎴 <span id="drawCountTop">0</span></div>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" data-page="draw">🎴 抽卡</div>
        <div class="tab" data-page="album">📖 卡册</div>
        <div class="tab" data-page="craft">🔧 合成</div>
        <div class="tab" data-page="achieve">🏆 成就</div>
    </div>

    <div class="content">
        <!-- Draw Page -->
        <div class="page active" id="page-draw">
            <div class="draw-area">
                <button class="draw-btn" id="drawBtn">
                    🎴
                    <div class="cooldown-overlay" id="cooldownOverlay"></div>
                </button>
                <div class="draw-info" id="drawInfo">点击抽卡 · 冷却 <span id="cooldownDisplay">0.5</span>s</div>
                <div class="draw-actions">
                    <button class="draw-action-btn" id="multiDrawBtn">🎲 10连</button>
                    <button class="draw-action-btn" id="autoDrawBtn" style="display:none">▶ 自动</button>
                </div>
            </div>
            <div class="draw-result empty" id="drawResult">🃏 点击上方卡牌开始抽卡</div>
        </div>

        <!-- Album Page -->
        <div class="page" id="page-album"><div id="albumContainer"></div></div>

        <!-- Craft Page -->
        <div class="page" id="page-craft">
            <div class="shard-bar">
                <span class="shard-icon">💎</span>
                <span class="shard-count" id="shardDisplay">0</span>
                <span class="shard-label">碎片</span>
                <button class="shard-btn" id="exchangeBtn">兑换R卡</button>
            </div>
            <div class="tool-list" id="toolList"></div>
        </div>

        <!-- Achievements Page -->
        <div class="page" id="page-achieve"><div class="achieve-list" id="achieveList"></div></div>
    </div>

    <div class="footer">抽卡合成器 v2 🚀</div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-title" id="modalTitle">🎉 抽卡结果</div>
        <div class="modal-sub" id="modalSub"></div>
        <div class="modal-cards" id="modalCards"></div>
        <button class="modal-close" id="modalClose">好的</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ========================================================================
//  DATA
// ========================================================================

const RARITIES = ['N', 'R', 'SR', 'SSR'];
const RARITY_LABEL = { N: '普通', R: '稀有', SR: '史诗', SSR: '传说' };
const RARITY_ORDER = { N: 0, R: 1, SR: 2, SSR: 3 };
const RARITY_COLORS = { N: '#8fafc0', R: '#5bc77e', SR: '#a078e0', SSR: '#f0a030' };

// ---- Cards ----
const CARDS = {
    N: [
        { emoji: '🐱', name: '猫咪' },    { emoji: '🐶', name: '小狗' },

        { emoji: '🦥', name: '树懒' },    { emoji: '🦦', name: '水獭' },
        { emoji: '🦔', name: '刺猬' },    { emoji: '🐧', name: '企鹅' },
        { emoji: '🐳', name: '鲸鱼' },    { emoji: '🐊', name: '鳄鱼' },
        { emoji: '🦚', name: '孔雀' },    { emoji: '🐫', name: '骆驼' },
        { emoji: '🐘', name: '大象' },    { emoji: '🦎', name: '蜥蜴' },
        { emoji: '🐌', name: '蜗牛' },    { emoji: '🐞', name: '瓢虫' },
        { emoji: '🦋', name: '蝴蝶' },    { emoji: '🦀', name: '螃蟹' },
        { emoji: '🦗', name: '蟋蟀' },    { emoji: '🦢', name: '天鹅' },

    R: [
        { emoji: '🦄', name: '独角兽' },  { emoji: '🦅', name: '雄鹰' },

        { emoji: '🦁', name: '雄狮' },    { emoji: '🐅', name: '猛虎' },
        { emoji: '🦩', name: '火烈鸟' },  { emoji: '🦭', name: '海豹' },
        { emoji: '🐺', name: '灰狼' },    { emoji: '🐃', name: '野牛' },
        { emoji: '🦒', name: '长颈鹿' },
    ],
    SR: [
        { emoji: '🧙', name: '法师' },    { emoji: '🧝', name: '精灵' },
        { emoji: '🦸', name: '英雄' },    { emoji: '🧛', name: '吸血鬼' },
        { emoji: '🦹', name: '暗影' },    { emoji: '🧜', name: '人鱼' },
        { emoji: '🧚', name: '仙子' },    { emoji: '🏹', name: '射手' },
        { emoji: '⚔️', name: '剑士' },   { emoji: '🛡️', name: '圣盾' },
        { emoji: '🌪️', name: '风暴' },   { emoji: '❄️', name: '冰霜' },
        { emoji: '🌿', name: '自然' },    { emoji: '⚡', name: '雷霆' },
    ],
    SSR: [
        { emoji: '👑', name: '王者' },    { emoji: '🌟', name: '星辰' },
        { emoji: '🔥', name: '烈焰' },    { emoji: '💎', name: '宝石' },
        { emoji: '🎆', name: '烟火' },    { emoji: '🌈', name: '彩虹' },
        { emoji: '🗡️', name: '神剑' },   { emoji: '🪐', name: '星环' },
        { emoji: '🕯️', name: '圣光' },   { emoji: '⚖️', name: '天秤' },
        { emoji: '🌀', name: '极光' },    { emoji: '🌌', name: '银河' },
    ],
};

// Build lookup
const CARD_MAP = {};
for (const r of RARITIES) for (const c of CARDS[r]) CARD_MAP[c.emoji] = { ...c, rarity: r };
function getRarity(k) { return CARD_MAP[k].rarity; }
function getCardName(k) { return CARD_MAP[k].name; }

// ---- Tools (20) ----
const TOOLS = [
    { id: 'wand',       emoji: '🪄',  name: '魔法棒',     desc: '抽卡额外张数',
      effect: l => `+${l} 张`,        recipe: { '🐱':3,'🐶':3,'🦄':1 } },
    { id: 'lens',       emoji: '🔍',  name: '幸运透镜',   desc: 'SSR概率提升',

// ========================================================================
//  STATE
// ========================================================================

function defaultState() {
    return {
        cards: {}, tools: {}, shards: 0, totalDraws: 0, ssrCount: 0,
        totalShardUsed: 0, achieveClaimed: {}, pityCount: 0, ssrPityCount: 0,
        autoDrawOn: false, permanentSSRBoost: 0,
    };
}
let state = defaultState();
let _origRollRarity = null;

// ========================================================================
//  HELPERS
// ========================================================================

function cntUnique(s) { return Object.keys(s.cards).filter(k=>s.cards[k]>0).length; }
function cntTotal(s)  { return Object.values(s.cards).reduce((a,b)=>a+b,0); }
function isSetComplete(s, r) { return CARDS[r].every(c=>(s.cards[c.emoji]||0)>0); }
function anyTool(s)   { return Object.values(s.tools).some(l=>l>0); }
function getShardValue(k) {
    const r=getRarity(k);
    return r==='N'?1: r==='R'?3: r==='SR'?8:20;
}
function formatNum(n) {
    if(n>=1e6) return (n/1e6).toFixed(1)+'M';
    if(n>=1e3) return (n/1e3).toFixed(1)+'K';
    return Math.floor(n).toString();
}
function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

// ========================================================================
//  BONUS
// ========================================================================

function getBonus() {
    const l = id => state.tools[id] || 0;
    return {
        extraCards: l('wand'),
        ssrBoost: l('lens') + (state.permanentSSRBoost||0),
        cdReduce: l('hourglass') * 0.05,
        shardChance: l('scroll') * 10,
        pityThreshold: Math.max(1, 11 - l('amulet')),
        autoLevel: l('auto_draw'),
        srBoost: l('precise') * 2,
        magnet: l('magnet') * 5,
        doubleChance: l('dice') * 5,
        rainbowChance: l('rainbow') * 3,
        shardMult: 1 + l('sieve') * 0.2,
        recycleChance: l('recycle') * 5,
        exchangeDiscount: l('alchemy'),
        saveChance: l('copy') * 3,
        passiveShards: l('tree'),
        drawShards: l('star'),
        ssrPityGap: Math.max(1, 30 - l('lucky_star') * 2),
        resonateShards: l('resonate') * 20,
        freeDraws: l('map') * 2,
        milestoneShards: l('champion') * 10,
    };
}

function getBaseCooldown() {
    return Math.max(0.1, 0.5 - getBonus().cdReduce);
}

// ========================================================================
//  DRAW
// ========================================================================

function rollRarity(bonus) {
    const ssr = 3 + bonus.ssrBoost;
    const sr  = 12 + bonus.srBoost;
    const r   = 30;
    const total = ssr + sr + r + 55;
    const roll = Math.random() * total;
    let cum = 0;
    cum += ssr; if(roll<cum) return 'SSR';
    cum += sr;  if(roll<cum) return 'SR';
    cum += r;   if(roll<cum) return 'R';
    return 'N';
}
_origRollRarity = rollRarity;

function rollCard(rarity) { return pick(CARDS[rarity]).emoji; }

function doSingleDraw(bonus) {
    let rarity = rollRarity(bonus);
    let cardKey = rollCard(rarity);
    let decomposed = false;
    let upgraded = false;

    // 彩虹桥: N→R
    if (rarity==='N' && bonus.rainbowChance>0 && Math.random()*100<bonus.rainbowChance) {
        rarity = 'R'; cardKey = rollCard('R'); upgraded = true;
    }

    // 潮汐卷轴: N自动分解
    if (rarity==='N' && bonus.shardChance>0 && Math.random()*100<bonus.shardChance) {
        state.shards += Math.floor(1 * bonus.shardMult);
        decomposed = true; 
    }

    // 星光收集: 每抽得碎片
    if (bonus.drawShards > 0) state.shards += bonus.drawShards;

    // 磁吸卡牌: 概率额外获得已有卡
    if (bonus.magnet>0 && Math.random()*100<bonus.magnet) {
        const owned = Object.keys(state.cards).filter(k=>state.cards[k]>0);
        if (owned.length>0) {
            const extra = pick(owned);
            state.cards[extra] = (state.cards[extra]||0) + 1;
        }
    }

    if (!decomposed) {
        state.cards[cardKey] = (state.cards[cardKey]||0) + 1;
    }
    if (rarity==='SSR') state.ssrCount = (state.ssrCount||0) + 1;

    return { cardKey, rarity, decomposed, upgraded };
}

function doDraw() {
    const bonus = getBonus();
    const total = 1 + bonus.extraCards;
    const results = [];
    let hasSRorAbove = false;

    state.pityCount = (state.pityCount||0) + 1;
    state.ssrPityCount = (state.ssrPityCount||0) + 1;

    for (let i=0; i<total; i++) {
        let guaranteed = false;
        // 守护符保底 SR+
        if (state.pityCount >= bonus.pityThreshold && !hasSRorAbove) {
            const r2 = Math.random()<0.25 ? 'SSR' : 'SR';
            const k2 = rollCard(r2);
            state.cards[k2] = (state.cards[k2]||0) + 1;
            if (r2==='SSR') state.ssrCount = (state.ssrCount||0) + 1;
            results.push({ cardKey:k2, rarity:r2, decomposed:false, guaranteed:true });
            hasSRorAbove = true; state.pityCount = 0;
            continue;
        }
        // 幸运星保底 SSR
        if (state.ssrPityCount >= bonus.ssrPityGap) {
            const k3 = rollCard('SSR');
            state.cards[k3] = (state.cards[k3]||0) + 1;
            state.ssrCount = (state.ssrCount||0) + 1;
            results.push({ cardKey:k3, rarity:'SSR', decomposed:false, guaranteed:true });
            state.ssrPityCount = 0; state.pityCount = 0;
            continue;
        }
        const r = doSingleDraw(bonus);
        if (r.rarity==='SSR' || r.rarity==='SR') { hasSRorAbove = true; state.pityCount = 0; }
        if (r.rarity==='SSR') { state.ssrPityCount = 0; }
        results.push(r);
    }

    // 命运骰子: 概率翻倍
    if (bonus.doubleChance>0 && Math.random()*100<bonus.doubleChance) {
        const cloned = results.map(r=>({...r}));
        results.push(...cloned);
    }

    state.totalDraws = (state.totalDraws||0) + results.length;

    // 冠军徽章: 每100抽奖励
    const prevHundred = Math.floor(((state.totalDraws||0)-results.length)/100);
    const curHundred = Math.floor((state.totalDraws)/100);
    if (curHundred > prevHundred && bonus.milestoneShards>0) {
        state.shards += bonus.milestoneShards * (curHundred - prevHundred);
    }

    return results;
}

// ========================================================================
//  AUTO-DRAW
// ========================================================================

let autoDrawTimer = null;
let autoDrawPoll = null;

function startAutoDraw() {
    state.autoDrawOn = true;
    autoDrawPoll = setInterval(() => {
        if (!isOnCooldown) { startDraw(); }
        // 更新按钮状态
        updateAutoBtn();
    }, 150);
    saveGame();
    updateAutoBtn();
    showToast('🤖 自动抽卡已开启');
}

function stopAutoDraw() {
    state.autoDrawOn = false;
    if (autoDrawPoll) { clearInterval(autoDrawPoll); autoDrawPoll = null; }
    saveGame();
    updateAutoBtn();
    showToast('🤖 自动抽卡已关闭');
}

function toggleAutoDraw() {
    if (state.autoDrawOn) stopAutoDraw();
    else startAutoDraw();
}

function updateAutoBtn() {
    const btn = document.getElementById('autoDrawBtn');
    if (!btn) return;
    if ((state.tools.auto_draw||0) > 0) {
        btn.style.display = 'inline-block';
        btn.textContent = state.autoDrawOn ? '⏹ 停止' : `▶ 自动 (${getBonus().autoLevel})`;
        btn.className = 'draw-action-btn' + (state.autoDrawOn ? ' active-auto' : '');
    } else {
        btn.style.display = 'none';
    }
}

// ========================================================================
//  CRAFT
// ========================================================================

function getToolCost(toolId, level) {
    const tool = TOOLS.find(t=>t.id===toolId);
    if (!tool) return null;
    const cost = {};
    for (const [emoji, base] of Object.entries(tool.recipe)) {
        cost[emoji] = Math.ceil(base * Math.pow(TOOL_COST_MULT, level));
    }
    return cost;
}

function canUpgradeTool(toolId) {
    const lvl = state.tools[toolId]||0;
    if (lvl >= MAX_TOOL_LVL) return false;
    const cost = getToolCost(toolId, lvl);
    if (!cost) return false;
    for (const [emoji, qty] of Object.entries(cost))
        if ((state.cards[emoji]||0) < qty) return false;
    return true;
}

function upgradeTool(toolId) {
    const lvl = state.tools[toolId]||0;
    if (lvl >= MAX_TOOL_LVL) return;
    const cost = getToolCost(toolId, lvl);
    if (!cost) return;
    for (const [emoji, qty] of Object.entries(cost))
        if ((state.cards[emoji]||0) < qty) return;

    const bonus = getBonus();
    // 复制之书: 概率不耗材
    for (const [emoji, qty] of Object.entries(cost)) {
        let actualQty = qty;
        if (bonus.saveChance>0 && Math.random()*100<bonus.saveChance) actualQty = 0;
        state.cards[emoji] = (state.cards[emoji]||0) - actualQty;
        if (state.cards[emoji] <= 0) delete state.cards[emoji];
    }
    state.tools[toolId] = lvl + 1;
    saveGame();
    renderAll();

    const tool = TOOLS.find(t=>t.id===toolId);
    showToast(`🔧 ${tool.emoji} ${tool.name} → Lv.${lvl+1}！`);

    // 冒险地图: 升级后免费抽
    if (bonus.freeDraws > 0) {
        const freeResults = [];
        for (let i=0; i<bonus.freeDraws; i++) {
            const r = doSingleDraw(getBonus());
            freeResults.push(r);
        }
        state.totalDraws = (state.totalDraws||0) + freeResults.length;
        saveGame();
        renderAll();
        showDrawModal(freeResults, `🗺️ 冒险奖励 ${freeResults.length} 张`);
    }
}

// ========================================================================
//  SHARDS
// ========================================================================

function decomposeCard(cardKey) {
    if (!state.cards[cardKey] || state.cards[cardKey]<=0) return;
    const bonus = getBonus();
    const base = getShardValue(cardKey);
    const gained = Math.floor(base * bonus.shardMult);
    state.cards[cardKey]--;
    if (state.cards[cardKey]<=0) delete state.cards[cardKey];
    state.shards += gained;
    // 转化炉: 概率返还
    if (bonus.recycleChance>0 && Math.random()*100<bonus.recycleChance) {
        state.cards[cardKey] = (state.cards[cardKey]||0) + 1;
        showToast(`♻️ 转化炉返还了 ${CARD_MAP[cardKey].emoji}`);
    }
    saveGame(); renderAll();
    showToast(`💎 +${gained} 碎片`);
}

function exchangeShard() {
    const bonus = getBonus();
    const cost = Math.max(10, 20 - (bonus.exchangeDiscount||0));
    if (state.shards < cost) { showToast(`💎 碎片不足 ${cost}`); return; }
    state.shards -= cost;
    state.totalShardUsed = (state.totalShardUsed||0) + cost;
    const card = pick(CARDS['R']);
    state.cards[card.emoji] = (state.cards[card.emoji]||0) + 1;
    saveGame(); renderAll();
    showToast(`🎴 兑换到 ${card.emoji} ${card.name}（${cost}💎）`);
}

// ========================================================================
//  ACHIEVEMENTS
// ========================================================================

function checkAchievements() {
    for (const a of ACHIEVEMENTS) {
        if (state.achieveClaimed[a.id]) continue;
        if (a.check(state)) {
            state.achieveClaimed[a.id] = true;
            if (a.reward.includes('💎')) {
                state.shards += parseInt(a.reward)||50;
            } else if (a.reward.includes('R卡×3')) {
                for(let i=0;i<3;i++){const c=pick(CARDS['R']);state.cards[c.emoji]=(state.cards[c.emoji]||0)+1;}
            } else if (a.reward.includes('SSR')) {
                const n = parseInt(a.reward.match(/×(\d)/)?.[1]||1);
                for(let i=0;i<n;i++){const c=pick(CARDS['SSR']);state.cards[c.emoji]=(state.cards[c.emoji]||0)+1;}
            } else if (a.reward.includes('SSR概率')) {
                state.permanentSSRBoost = (state.permanentSSRBoost||0)+1;
            }
            saveGame(); renderAll();
            setTimeout(()=>showToast(`🏆 成就: ${a.name}！奖励: ${a.reward}`),300);
        }
    }
}

// ========================================================================
//  SAVE / LOAD
// ========================================================================

function saveGame() {
    localStorage.setItem('cardgame2_save', JSON.stringify(state));
}

function loadGame() {
    try {
        const raw = localStorage.getItem('cardgame2_save');
        if (raw) {
            const s = JSON.parse(raw);
            state = {...defaultState(), ...s};
            state.cards = s.cards||{};
            state.tools = s.tools||{};
            state.achieveClaimed = s.achieveClaimed||{};
        }
    } catch(e) { console.warn('读档失败',e); }
}

// ---- Album ----
function renderAlbum() {
    const c = document.getElementById('albumContainer');
    let h = '';
    for (const r of RARITIES) {
        const cards = CARDS[r];
        const owned = cards.filter(c=>(state.cards[c.emoji]||0)>0).length;
        h += `<div class="album-group">
            <div class="album-group-title" style="color:${RARITY_COLORS[r]}">
                ${r} · ${RARITY_LABEL[r]}
                <span class="tag" style="background:${RARITY_COLORS[r]}22;color:${RARITY_COLORS[r]}">${owned}/${cards.length}</span>
            </div>
            <div class="album-grid">`;
        for (const c2 of cards) {
            const n = state.cards[c2.emoji]||0;
            h += `<div class="album-card" data-rarity="${r}" data-emoji="${c2.emoji}">
                <button class="decompose-btn" data-decompose="${c2.emoji}" title="分解">✕</button>
                <div class="card-emoji">${c2.emoji}</div>
                <div class="card-name">${c2.name}</div>
                <div class="card-count">${n>0?'×'+n:'—'}</div>
            </div>`;
        }
        h += `</div></div>`;
    }
    c.innerHTML = h;
    c.querySelectorAll('[data-decompose]').forEach(btn=>{
        btn.addEventListener('click',e=>{e.stopPropagation();decomposeCard(btn.dataset.decompose);});
    });
}

    document.getElementById('exchangeBtn').textContent = `${exchangeCost}💎→R卡`;

    const c = document.getElementById('toolList');
    let h = '';
    for (const tool of TOOLS) {
        const lvl = state.tools[tool.id]||0;
        const maxed = lvl >= MAX_TOOL_LVL;
        const canCraft = !maxed && canUpgradeTool(tool.id);
        const cost = maxed ? null : getToolCost(tool.id, lvl);

        h += `<div class="tool-item">
            <div class="tool-header">
                <div class="tool-icon">${tool.emoji}</div>
                <div class="tool-meta">
                    <div class="tool-name">${tool.name}</div>
                    <div class="tool-level">Lv.${lvl}/${MAX_TOOL_LVL} · ${maxed?'已满级':tool.desc}</div>
                    <div class="tool-effect">${lvl>0?tool.effect(lvl):'尚未激活'}</div>
                </div>
            </div>
            <div class="tool-body">`;
        if (!maxed) {
            h += `<div class="tool-cost">材料：`;
            for (const [emoji, qty] of Object.entries(cost)) {
                const have = state.cards[emoji]||0;
                const ok = have >= qty;
                h += `<span class="cost-item"><span class="${ok?'enough':'lack'}">${emoji} ${have}/${qty}</span></span>`;
            }
            h += `</div><button class="tool-craft-btn" data-craft="${tool.id}" ${canCraft?'':'disabled'}>升级 Lv.${lvl+1}</button>`;
        } else {
            h += `<button class="tool-craft-btn maxed" disabled>✅ 已满级</button>`;
        }
        h += `</div></div>`;
    }
    c.innerHTML = h;
    c.querySelectorAll('[data-craft]').forEach(btn=>{
        btn.addEventListener('click',()=>upgradeTool(btn.dataset.craft));
    });
}

// ---- Achievements ----
function renderAchievements() {
    const c = document.getElementById('achieveList');
    let h = '';
    for (const a of ACHIEVEMENTS) {
        const claimed = state.achieveClaimed[a.id];
        const done = a.check(state);
        let cls = 'locked', txt = '🔒 未达成';
        if (claimed) { cls='done'; txt='✅ 已完成'; }
        else if (done) { cls='claimable'; txt='🎁 领取'; }
        h += `<div class="achieve-item">
            <div class="achieve-icon">${a.icon}</div>
            <div class="achieve-info">
                <div class="achieve-name">${a.name}</div>
                <div class="achieve-desc">${a.desc} · ${a.reward}</div>
            </div>
            <div class="achieve-state ${cls}">${txt}</div>
        </div>`;
    }
    c.innerHTML = h;
}

// ========================================================================
//  DRAW EXECUTION
// ========================================================================

let isOnCooldown = false;
let drawTimer = null;

function startDraw() {
    if (isOnCooldown) return;
    const cd = getBaseCooldown();
    const results = doDraw();
    checkAchievements();
    saveGame();
    renderAll();
    showDrawModal(results);

    isOnCooldown = true;
    const btn = document.getElementById('drawBtn');
    const overlay = document.getElementById('cooldownOverlay');
    btn.disabled = true;
    let remaining = cd;
    overlay.textContent = remaining.toFixed(1)+'s';
    drawTimer = setInterval(()=>{
        remaining -= 0.1;
        if (remaining<=0) {
            clearInterval(drawTimer); drawTimer=null;
            overlay.textContent=''; btn.disabled=false; isOnCooldown=false;
        } else {
            overlay.textContent=remaining.toFixed(1)+'s';
        }
    },100);
}

function doMultiDraw() {
    if (isOnCooldown) return;
    const allResults = [];
    for (let i=0; i<10; i++) {
        const res = doDraw();
        allResults.push(...res);
    }
    checkAchievements();
    saveGame();
    renderAll();

    const ssrCount = allResults.filter(r=>r.rarity==='SSR').length;
    showDrawModal(allResults, `🎲 10连结果（${allResults.length}张，${ssrCount}张SSR）`);

    const cd = getBaseCooldown();
    isOnCooldown = true;
    const btn = document.getElementById('drawBtn');
    const overlay = document.getElementById('cooldownOverlay');
    btn.disabled = true;
    let remaining = cd;
    overlay.textContent = remaining.toFixed(1)+'s';
    drawTimer = setInterval(()=>{
        remaining -= 0.1;
        if (remaining<=0) {
            clearInterval(drawTimer); drawTimer=null;
            overlay.textContent=''; btn.disabled=false; isOnCooldown=false;
        } else {
            overlay.textContent=remaining.toFixed(1)+'s';
        }
    },100);
}

// ---- Modal ----
function showDrawModal(results, title) {
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalTitle').textContent = title || '🎉 抽卡结果';
    const ssrN = results.filter(r=>r.rarity==='SSR').length;
    const srN = results.filter(r=>r.rarity==='SR').length;
    const dcN = results.filter(r=>r.decomposed).length;
    let sub = `共${results.length}张 · SSR×${ssrN} · SR×${srN}`;
    if (dcN>0) sub += ` · 💎分解×${dcN}`;
    document.getElementById('modalSub').textContent = sub;
    const container = document.getElementById('modalCards');
    results.sort((a,b)=>RARITY_ORDER[b.rarity]-RARITY_ORDER[a.rarity]);
    container.innerHTML = results.map((r,i)=>{
        const extra = [];
        if (r.decomposed) extra.push('data-decomposed');
        if (r.guaranteed) extra.push('data-guaranteed');
        const label = r.decomposed?'💎':r.rarity;
        return `<div class="draw-card" data-rarity="${r.rarity}" style="animation-delay:${i*.03}s" ${extra.join(' ')}>
            <span>${r.cardKey}</span>
            <span class="rarity-tag">${r.upgraded?'⬆️':label}</span>
        </div>`;
    }).join('');
    overlay.classList.add('open');
}

// ---- Toast ----
let toastTimer = null;
function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>el.classList.remove('show'),2000);
}

// ========================================================================
//  PASSIVE SHARDS (知识古树)
// ========================================================================

setInterval(() => {
    const b = getBonus();
    if (b.passiveShards > 0) {
        state.shards += b.passiveShards;
        saveGame(); renderTop(); renderCraft();
    }
    // 共鸣水晶检查: 集齐N卡时奖励
    if (b.resonateShards > 0 && isSetComplete(state, 'N')) {
        // 只触发一次，存标记
        if (!state._resonatePaid) {
            state.shards += b.resonateShards;
            state._resonatePaid = true;
            saveGame(); renderAll();
            showToast(`🎵 共鸣水晶！N卡全齐 +${b.resonateShards}💎`);
        }
    } else {
        state._resonatePaid = false;
    }
}, 10000);

// ========================================================================
//  INIT
// ========================================================================

function init() {
    loadGame();

    // Tab switching
    document.querySelectorAll('.tab').forEach(tab=>{
        tab.addEventListener('click',()=>{
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
            tab.classList.add('active');
            currentPage = tab.dataset.page;
            document.getElementById('page-'+currentPage).classList.add('active');
            // 切换到其他页时自动停止自动抽卡
            if (currentPage !== 'draw' && state.autoDrawOn) {
                stopAutoDraw();
            }
        });
    });

    document.getElementById('drawBtn').addEventListener('click', startDraw);
    document.getElementById('multiDrawBtn').addEventListener('click', doMultiDraw);
    document.getElementById('autoDrawBtn').addEventListener('click', toggleAutoDraw);
    document.getElementById('exchangeBtn').addEventListener('click', exchangeShard);
    document.getElementById('modalClose').addEventListener('click', ()=>{
        document.getElementById('modalOverlay').classList.remove('open');
    });
    document.getElementById('modalOverlay').addEventListener('click', e=>{
        if (e.target===e.currentTarget) document.getElementById('modalOverlay').classList.remove('open');
    });

    renderAll();
    // 自动恢复自动抽卡（如果之前开着）
    if (state.autoDrawOn) startAutoDraw();
}

document.addEventListener('DOMContentLoaded', init);
</script>
